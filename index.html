<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestione POS</title>
<style>
:root{
  --navy:#232d7a; --navy-2:#1a2260; --blue:#0b72b8; --orange:#f28c1e;
  --bg:#f3f5fa; --card:#fff; --ink:#1b2133; --muted:#667089; --line:#dde2ee; --soft:#eef1f9;
  --ok:#17803d; --err:#b3261e; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
h1,h2,h3{margin:0;line-height:1.2}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:
  radial-gradient(900px 400px at 10% -10%,rgba(11,114,184,.12),transparent 60%),
  radial-gradient(700px 400px at 100% 110%,rgba(242,140,30,.14),transparent 60%),var(--bg)}
.login-card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px 28px;box-shadow:0 18px 50px rgba(35,45,122,.12)}
.login-card img{display:block;width:230px;max-width:80%;margin:0 auto 18px}
.login-card h1{font-size:22px;text-align:center;color:var(--navy);margin-bottom:4px}
.login-card p.sub{text-align:center;color:var(--muted);margin:0 0 22px}
.err{color:var(--err);font-size:14px;min-height:20px;margin:8px 0 0}

/* ---------- form elements ---------- */
label.f{display:block;font-weight:600;font-size:13px;color:var(--navy);margin:0 0 5px}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=search],input[type=url],textarea,select{
  width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid #c9d0e2;border-radius:9px;padding:9px 11px;outline:none;transition:border .15s,box-shadow .15s}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,114,184,.15)}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:9px;padding:9px 15px;font-weight:600;background:var(--navy);color:#fff;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.12)} .btn:active{transform:translateY(1px)}
.btn.sec{background:#fff;color:var(--navy);border-color:#c3cbe0}
.btn.orange{background:var(--orange);color:#fff}
.btn.danger{background:#fff;color:var(--err);border-color:#e7c3c0}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;flex:none}

/* ---------- app shell ---------- */
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:8px 22px}
header.top img{height:46px;display:block}
header.top .sp{flex:1}
header.top nav{display:flex;gap:4px}
header.top nav button{background:none;border:0;padding:9px 14px;border-radius:9px;font-weight:600;color:var(--muted)}
header.top nav button.on{background:var(--soft);color:var(--navy)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:50%;background:#b8c0d4;display:inline-block}
.chip.ok i{background:var(--ok)} .chip.bad i{background:var(--err)}
main{max-width:1180px;margin:0 auto;padding:26px 22px 80px}
.pagehead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.pagehead h2{font-size:24px;color:var(--navy);flex:1}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.card h3{font-size:17px;color:var(--navy);margin-bottom:4px}
.card .hint{color:var(--muted);font-size:13.5px;margin:0 0 16px}

/* list */
.toolbar{display:flex;gap:10px;margin-bottom:14px}
.toolbar input{max-width:360px}
table.list{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.list th{background:var(--soft);color:var(--navy);text-align:left;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;padding:11px 14px}
.list td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
.list tr:hover td{background:#fafbff}
.list .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.list .ogg{font-weight:600;color:var(--navy)}
.list .sm2{color:var(--muted);font-size:13px}
.empty{padding:50px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #c3cbe0;border-radius:var(--radius)}
@media(max-width:820px){.list thead{display:none}.list,.list tbody,.list tr,.list td{display:block;width:100%}.list tr{border-top:1px solid var(--line);padding:8px 0}.list td{border:0;padding:4px 14px}.list .acts{justify-content:flex-start}}

/* wizard */
.wiz{display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start}
.steps{position:sticky;top:76px;display:flex;flex-direction:column;gap:6px}
.steps button{display:flex;align-items:center;gap:11px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-weight:600}
.steps button b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--navy);font-size:13px;flex:none}
.steps button.on{border-color:var(--navy);box-shadow:0 0 0 2px rgba(35,45,122,.12)}
.steps button.on b{background:var(--navy);color:#fff}
.steps button.done b{background:var(--ok);color:#fff}
@media(max-width:900px){.wiz{grid-template-columns:1fr}.steps{position:static;flex-direction:row;overflow:auto;padding-bottom:4px}.steps button{white-space:nowrap}}
.wizfoot{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.def{font-size:12px;color:var(--muted);font-weight:400}

/* toggles lavorazioni */
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{display:inline-flex;align-items:center;gap:9px;padding:10px 15px;border-radius:99px;border:1.5px solid #c3cbe0;background:#fff;color:var(--ink);font-weight:600;transition:all .15s}
.pill::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid #aab3cc;background:#fff;flex:none;transition:all .15s}
.pill[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.pill[aria-pressed=true]::before{border-color:#fff;background:var(--orange);box-shadow:inset 0 0 0 3px var(--navy)}

/* data grids */
.dg{width:100%;border-collapse:collapse;margin:6px 0 10px}
.dg th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:4px 6px}
.dg td{padding:4px 5px;vertical-align:top}
.dg td.x{width:40px}
.paste{background:var(--soft);border:1px dashed #b7c0da;border-radius:10px;padding:12px;margin-top:10px}
.paste textarea{background:#fff;min-height:90px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
.paste .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.sep{height:1px;background:var(--line);margin:22px 0}

/* preview */
section.docx{overflow:visible!important}
#previewBox{background:#c9cfdf;border-radius:var(--radius);padding:16px;overflow:auto;max-height:78vh}
#previewBox .docx-wrapper{background:transparent!important;padding:0!important}
.exportbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}

/* toast + modal */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:all .25s;z-index:100;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:var(--err)} #toast.good{background:var(--ok)}
.modalbg{position:fixed;inset:0;background:rgba(15,20,50,.45);display:grid;place-items:center;z-index:90;padding:20px}
.modal{background:#fff;border-radius:14px;padding:24px;width:min(480px,100%)}
.modal h3{color:var(--navy);margin-bottom:8px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

/* print: solo il documento */
#printHost{position:absolute;left:-20000px;top:0;width:210mm}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body>*:not(#printHost){display:none!important}
  #printHost{position:static!important;width:auto!important;display:block!important}
  #printHost .docx-wrapper{background:#fff!important;padding:0!important}
  #printHost .docx-wrapper>section.docx{box-shadow:none!important;margin:0!important;break-after:page}
}
</style>
</head>

let toastT;
function toast(msg, kind=''){ const t=$('#toast'); t.textContent=msg; t.className='show '+kind; clearTimeout(toastT); toastT=setTimeout(()=>t.className='',3600); }
function modal({title, body, ok='Conferma', cancel='Annulla', danger=false}){
  return new Promise(res=>{
    const root=$('#modalRoot');
    root.innerHTML=`<div class="modalbg"><div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><div>${body}</div><div class="row">${cancel?`<button class="btn sec" data-r="0">${cancel}</button>`:''}<button class="btn ${danger?'danger':''}" data-r="1">${ok}</button></div></div></div>`;
    root.onclick=e=>{ const b=e.target.closest('[data-r]'); if(b){ const v=b.dataset.r==='1'; const out = v ? {inputs:[...root.querySelectorAll('input')].map(i=>i.value)} : null; root.innerHTML=''; res(out);} else if(e.target.classList.contains('modalbg')){ root.innerHTML=''; res(null);} };
    const i=root.querySelector('input'); if(i) i.focus();
  });
}
function busy(btn, on, label){ if(!btn) return; if(on){ btn.dataset.l=btn.innerHTML; btn.disabled=true; btn.textContent=label||'Attendere…'; } else { btn.disabled=false; if(btn.dataset.l) btn.innerHTML=btn.dataset.l; } }

const gasUrl = () => { try{ return localStorage.getItem('pos_gas_url') || CFG.GAS_URL; }catch(e){ return CFG.GAS_URL; } };
async function apiFetch(action, payload){
  const url = gasUrl();
  let r;
  try{
  if(payload === undefined){
    const [act,...rest]=action.split('&');   // es. "get&id=POS-1": l'azione e i parametri vanno separati
    r = await fetch(`${url}?action=${encodeURIComponent(act)}${rest.map(x=>'&'+x).join('')}&key=${encodeURIComponent(CFG.PWD)}&_=${Date.now()}`, {redirect:'follow'});
  } else {
    r = await fetch(url, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action, key:CFG.PWD, ...payload})});
  }
  }catch(e){ const er=new Error('Impossibile contattare lo script Google. Controlla che la distribuzione abbia accesso “Chiunque” (non “Solo io”) e “Esegui come: Me”, che sia stata pubblicata una NUOVA VERSIONE con il codice di Code.gs e che setup() sia stato eseguito e autorizzato. Soluzione più sicura: apri l’app direttamente dall’URL /exec (vedi istruzioni).'); er.net=true; throw er; }
  const txt = await r.text();
  let j; try{ j = JSON.parse(txt); }catch(e){ throw new Error('Risposta non valida dallo script Google (controlla la distribuzione: accesso “Chiunque” e codice aggiornato).'); }
  if(!j.ok) throw new Error(j.error || 'Errore dello script Google');
  return j;
}
/* Canale alternativo senza CORS: modulo POST verso un iframe nascosto, risposta via postMessage */
function apiFrame(action, payload){
  return new Promise((resolve,reject)=>{
    const [act,...rest]=action.split('&'); const params={}; rest.forEach(x=>{ const i=x.indexOf('='); params[x.slice(0,i)]=decodeURIComponent(x.slice(i+1)); });
    const rid='r'+Date.now()+Math.random().toString(36).slice(2,7);
    const body=JSON.stringify({action:act, key:CFG.PWD, ...params, ...(payload||{})});
    const ifr=document.createElement('iframe'); ifr.name=rid; ifr.style.display='none';
    const form=document.createElement('form'); form.method='POST'; form.action=gasUrl(); form.target=rid; form.style.display='none';
    [['rid',rid],['payload',body]].forEach(([k,v])=>{ const i=document.createElement('input'); i.type='hidden'; i.name=k; i.value=v; form.appendChild(i); });
    const done=(fn,v)=>{ clearTimeout(to); window.removeEventListener('message',onMsg); ifr.remove(); form.remove(); fn(v); };
    const onMsg=e=>{ const d=e.data; if(d && d.rid===rid){ const r=d.data; r&&r.ok ? done(resolve,r) : done(reject,new Error((r&&r.error)||'Errore dello script Google')); } };
    const to=setTimeout(()=>done(reject,new Error('Nessuna risposta dallo script Google (timeout). Controlla distribuzione, accesso “Chiunque” e che Code.gs sia l’ultima versione pubblicata.')),60000);
    window.addEventListener('message',onMsg); document.body.appendChild(ifr); document.body.appendChild(form); form.submit();
  });
}
function apiGoogleRun(action, payload){
  return new Promise((resolve,reject)=>{
    const [act,...rest]=action.split('&'); const params={}; rest.forEach(x=>{ const i=x.indexOf('='); params[x.slice(0,i)]=decodeURIComponent(x.slice(i+1)); });
    const body=JSON.stringify({action:act, key:CFG.PWD, ...params, ...(payload||{})});
    google.script.run.withSuccessHandler(r=>{ r&&r.ok ? resolve(r) : reject(new Error((r&&r.error)||'Errore dello script Google')); })
      .withFailureHandler(e=>reject(new Error((e&&e.message)||String(e)))).apiCall(body);
  });
}
/* Canale 3 (solo lettura): JSONP con tag <script>, non soggetto a CORS */
function apiJsonp(action){
  return new Promise((resolve,reject)=>{
    const cb='__jp'+Date.now()+Math.floor(Math.random()*1e4); const s=document.createElement('script');
    const clean=()=>{ clearTimeout(to); delete window[cb]; s.remove(); };
    window[cb]=d=>{ clean(); d&&d.ok ? resolve(d) : reject(new Error((d&&d.error)||'Errore dello script Google')); };
    s.onerror=()=>{ clean(); const e=new Error('JSONP non riuscito'); e.net=true; reject(e); };
    const to=setTimeout(()=>{ clean(); const e=new Error('JSONP timeout'); e.net=true; reject(e); },20000);
    s.src=`${gasUrl()}?action=${action}&key=${encodeURIComponent(CFG.PWD)}&callback=${cb}&_=${Date.now()}`; document.body.appendChild(s);
  });
}
async function api(action, payload){
  if(typeof google!=='undefined' && google.script && google.script.run) return apiGoogleRun(action, payload);   // app aperta dall'URL /exec
  try{ return await apiFetch(action, payload); }
  catch(e){
    if(!e.net) throw e;
    if(payload===undefined){ try{ return await apiJsonp(action); }catch(e2){ if(!e2.net) throw e2; } }
    return await apiFrame(action, payload);
  }
}

/* ---- parsing incolla ---- */
function parseTSV(t){ const rows=[]; let row=[],cell='',q=false; for(let i=0;i<t.length;i++){ const c=t[i]; if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; } else if(c==='"'&&cell===''){ q=true; } else if(c==='\t'){ row.push(cell); cell=''; } else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; } else cell+=c; } row.push(cell); rows.push(row); return rows; }
/* Incolla da Excel o da tabelle Word: in Word le celle con più paragrafi non hanno le virgolette,
   quindi le righe senza tabulazione sono la continuazione dell'ultima cella della riga precedente. */
function pasteRows(txt){
  let rows=parseTSV(txt);
  if(/\t/.test(txt)){
    const out=[];
    rows.forEach(r=>{
      if(r.length===1 && out.length) out[out.length-1][out[out.length-1].length-1]+='\n'+r[0];
      else out.push(r.slice());
    });
    rows=out;
  }
  rows=rows.filter(r=>r.some(c=>String(c).trim()));
  if(rows.length>1 && rows[0].length>=2 && /^(nominativo|nome|mezzo|veicolo)/i.test(rows[0][0].trim()) && /^(mansione|targa)/i.test(rows[0][1].trim())) rows=rows.slice(1);   // salta l'intestazione
  return rows;
}
function parseTable(text){
  text=text.replace(/\r/g,'').replace(/^\n+|\n+$/g,'');
  let rows;
  if(text.includes('\t')) rows=parseTSV(text);
  else rows=text.split('\n').map(l=>l.includes(';')?l.split(';'):l.includes('|')?l.split('|'):l.split(','));
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c));
}
const splitAtt = s => String(s).split(/[\n|,;]+/).map(x=>x.trim()).filter(Boolean);

    <table class="dg"><thead><tr><th>Nominativo</th><th>Mansione</th><th>Attestati</th><th></th></tr></thead><tbody>${wRows}</tbody></table>

  const W=$('#cW',el), M=$('#cM',el);
  const setW=(w,f,v)=>{ if(f==='att') w.attestati=splitAtt(v); else w[f]=v; };
  const setM=(m,f,v)=>{ m[f]=v; };
  const grid=(box,list,blank,setter)=>{
    box.addEventListener('input',e=>{ const tr=e.target.closest('tr[data-i]'); if(!tr||!e.target.dataset.f) return; setter(cur[list][+tr.dataset.i],e.target.dataset.f,e.target.value); dirty=true; });

      const fields=[...tr.querySelectorAll('input[data-f]')].map(x=>x.dataset.f); const c0=fields.indexOf(inp.dataset.f);

      const inp=e.target.closest('input[data-f]'); if(!inp) return;
      const dir=e.key==='Enter'||e.key==='ArrowDown'?1:e.key==='ArrowUp'?-1:0; if(!dir) return;
      const tr=inp.closest('tr'); const sib=dir>0?tr.nextElementSibling:tr.previousElementSibling; if(!sib) return;
      e.preventDefault(); const nx=sib.querySelector(`input[data-f="${inp.dataset.f}"]`); if(nx){ nx.focus(); nx.select(); }
    });
    box.addEventListener('click',e=>{
      const d=e.target.closest('[data-del]'), a=e.target.closest('[data-add]'), c=e.target.closest('[data-clear]');
      if(d){ cur[list].splice(+d.dataset.del,1); if(!cur[list].length) cur[list].push(blank()); dirty=true; renderEdit(true); }
      else if(a){ for(let i=0;i<+a.dataset.add;i++) cur[list].push(blank()); dirty=true; renderEdit(true); }
      else if(c){ cur[list]=[blank()]; dirty=true; renderEdit(true); }
    });
  };
  grid(W,'lavoratori',()=>({nome:'',mansione:'',attestati:[]}),setW);
  grid(M,'mezzi',()=>({mezzo:'',targa:''}),setM);
}

let previewTok=0;
async function s5(el){
  el.innerHTML=`<div class="card"><h3>Anteprima ed esportazione</h3><p class="hint">L’anteprima è generata dal modello Word. Il PDF si ottiene dalla finestra di stampa (scegli “Salva come PDF”).</p>
  <div class="exportbar"><button class="btn orange" id="bSave">Salva su Google Sheet</button><button class="btn" id="bWord">Scarica Word (.docx)</button><button class="btn sec" id="bPdf">Esporta PDF</button><button class="btn sec" id="bPdfG" title="Conversione tramite Google: fedeltà massima al Word">PDF alta fedeltà (Google)</button><button class="btn sec" id="bRef">Aggiorna anteprima</button></div>
  <div id="previewBox"><div style="padding:30px;text-align:center;color:#556">Generazione anteprima…</div></div></div>${foot(false)}`;
  $('#bSave',el).onclick=savePos; $('#bWord',el).onclick=()=>exportWord(cur); $('#bPdf',el).onclick=()=>exportPdf(cur); $('#bPdfG',el).onclick=e=>exportPdfGoogle(cur,e.currentTarget); $('#bRef',el).onclick=()=>renderPreview();
  renderPreview();
}
async function renderPreview(){
  const box=$('#previewBox'); if(!box) return; const tok=++previewTok;
  try{
    const blob=await buildDocx(cur,true); if(tok!==previewTok) return;
    box.innerHTML=''; await docx.renderAsync(blob, box, null, {inWrapper:true, ignoreWidth:false, ignoreHeight:false, breakPages:true, useBase64URL:true});
  }catch(e){ console.error(e); box.innerHTML='<div style="padding:30px;color:#b3261e">Errore nella generazione: '+esc(e.message)+'</div>'; }
}
$('#btnSave').onclick=savePos;

async function savePos(){
  if(!cur.oggetto.trim()){ toast('Inserisci l’oggetto dei lavori prima di salvare','bad'); step=0; renderEdit(); return; }
  const btns=[$('#btnSave'),$('#bSave')].filter(Boolean); btns.forEach(b=>busy(b,true,'Salvataggio…'));
  try{
    const j=await api('save',{pos:cur}); cur.id=j.id; dirty=false; setConn('ok','Google Sheet collegato'); toast('POS salvato su Google Sheet','good');
    $('#editTitle').textContent='Modifica POS';
  }catch(e){ setConn('bad','Non raggiungibile'); toast(e.message,'bad'); }
  btns.forEach(b=>busy(b,false));
}

/* =====================================================================
   GENERAZIONE DOCX dal modello
   ===================================================================== */
const WNS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const XMLNS='http://www.w3.org/XML/1998/namespace';
let tplZip=null;
async function getTpl(){ if(!tplZip) tplZip=await JSZip.loadAsync(TEMPLATE_B64,{base64:true}); return tplZip; }

const lname=(n)=>n.localName;
const kids=(el,name)=>[...el.children].filter(c=>c.namespaceURI===WNS&&(!name||c.localName===name));
const all=(el,name)=>[...el.getElementsByTagNameNS(WNS,name)];
function stripIds(n){ for(const e of [n,...n.getElementsByTagName('*')]){ for(const a of [...e.attributes]){ if(a.localName==='paraId'||a.localName==='textId') e.removeAttributeNode(a); } } return n; }
function mk(doc,name){ return doc.createElementNS(WNS,'w:'+name); }
function setText(p,text){
  const doc=p.ownerDocument;
  all(p,'proofErr').forEach(e=>e.remove());
  const runs=all(p,'r').filter(r=>kids(r,'t').length);
  let r0,t;
  if(runs.length){ r0=runs[0]; runs.slice(1).forEach(r=>r.remove()); const ts=kids(r0,'t'); ts.slice(1).forEach(x=>x.remove()); t=ts[0]; }
  else { r0=mk(doc,'r'); const ppr=kids(p,'pPr')[0], prp=ppr&&kids(ppr,'rPr')[0]; if(prp){ const rp=mk(doc,'rPr'); kids(prp).forEach(c=>{ if(!['ins','del','moveFrom','moveTo','rPrChange'].includes(c.localName)) rp.appendChild(c.cloneNode(true)); }); r0.appendChild(rp); } p.appendChild(r0); t=mk(doc,'t'); r0.appendChild(t); }
  t.setAttributeNS(XMLNS,'xml:space','preserve'); t.textContent=text;
}
function setCellLines(tc,lines){
  const ps=kids(tc,'p'); const tpl=ps[0].cloneNode(true); ps.forEach(p=>p.remove());
  if(!lines.length) lines=[''];
  lines.forEach(l=>{ const p=stripIds(tpl.cloneNode(true)); setText(p,l); tc.appendChild(p); });
}
const lines=s=>String(s||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
function addPBB(p){ const doc=p.ownerDocument; let ppr=kids(p,'pPr')[0]; if(!ppr){ ppr=mk(doc,'pPr'); p.insertBefore(ppr,p.firstChild); } if(kids(ppr,'pageBreakBefore').length) return; const pb=mk(doc,'pageBreakBefore'); const skip=['pStyle','keepNext','keepLines']; const ref=kids(ppr).find(c=>!skip.includes(c.localName)); ppr.insertBefore(pb,ref||null); }
const textOf=n=>n.textContent;
const isBlank=p=>p.localName==='p'&&!p.textContent.trim()&&!all(p,'drawing').length&&!all(p,'sectPr').length&&!all(p,'pict').length;
const xmlEsc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const slug=s=>String(s||'POS').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60)||'POS';
function revString(r){ r=String(r||'').trim(); if(!r) return ''; const m=/^rev\.?\s*(.*)$/i.exec(r); return 'REV.'+(m?m[1]:r); }

const xmlDecl=s=>'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+s.replace(/^<\?xml[^>]*\?>\s*/,'');
async function buildDocx(pos,preview=false){
  const z=await JSZip.loadAsync(TEMPLATE_B64,{base64:true});
  const parser=new DOMParser(), ser=new XMLSerializer();
  const oggetto=(pos.oggetto||'').replace(/\s*\n\s*/g,' ').trim();
  const comune=(pos.comune||'').trim();
  const comuneNome=comune.replace(/\s*\(.*\)\s*$/,'');
  const rev=revString(pos.revisione);
  const headRev=[rev,fmtDate(pos.dataPos)].filter(Boolean).join(' ');

  /* ---------- document.xml ---------- */
  const doc=parser.parseFromString(await z.file('word/document.xml').async('string'),'application/xml');
  const body=doc.getElementsByTagNameNS(WNS,'body')[0];
  const E=[...body.children];                       // indici = elementi del modello originale
  const cell=(i,r,c)=>kids(kids(E[i],'tr')[r],'tc')[c];

  // --- copertina ---
  setText(kids(all(E[13],'sdt')[0],'sdtContent')[0], oggetto);   // oggetto (campo collegato alle proprietà del file)
  if(comune) setText(E[14],'Comune di '+comune); else E[14].remove();
  E[15].remove();                                                    // vecchio NTW
  setCellLines(cell(16,0,1),[fmtDate(pos.dataInizio)]);
  setCellLines(cell(16,1,1),[fmtDate(pos.dataFine)]);

  // --- 1. ruoli ---
  ['committente','respLavori','csp','cse','azienda','preposto','antincendio','primoSoccorso']
    .forEach((k,i)=>setCellLines(cell(57,i+1,1),lines(pos[k])));

  // --- anagrafica di cantiere ---
  [oggetto,comune,pos.importo,pos.oneri,pos.nLavoratori,fmtDate(pos.dataInizio),pos.uominiGiorno,fmtDate(pos.dataFine)]
    .forEach((v,i)=>setCellLines(cell(63,i,1),[String(v||'').trim()]));

  // --- 2. lavorazioni (pallino pieno = selezionata, vuoto = non selezionata, come nel modello) ---
  const setBullet=(p,on)=>all(p,'numId')[0].setAttributeNS(WNS,'w:val',on?'3':'5');
  LAVORAZIONI.forEach(([n],i)=>setBullet(E[87+i],(pos.lavorazioni||[]).includes(n)));
  const altro=(pos.altro||'').trim();
  setBullet(E[96],!!altro); setText(E[96],altro?('Altro: '+altro):'Altro_______________________________________');

  // --- descrizione sintetica ---
  {
    const ref=E[108];
    String(pos.descrizione||'').replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
      const isB=/^[-•*–]\s+/.test(l);
      const p=stripIds((isB?E[103]:E[102]).cloneNode(true));
      setText(p,(isB?l.replace(/^[-•*–]\s+/,''):l).replace(/\{COMUNE\}/g,comuneNome||'…'));
      body.insertBefore(p,ref);
    });
    for(let i=102;i<=107;i++) E[i].remove();
  }

  // --- 3. numeri utili: ospedale in penultima riga ---
  {
    const tr=kids(E[130],'tr').find(r=>/^\s*Ospedale/i.test(r.textContent));
    if(tr){
      const o=lines(pos.ospedale), n=(pos.ospedaleNum||'').trim();
      if(!o.length&&!n) tr.remove(); else { const tcs=kids(tr,'tc'); setCellLines(tcs[0],o); setCellLines(tcs[1],[n]); }
    }
  }

  // --- 4. lavoratori / 5. mezzi ---
  const fillRows=(tbl,items,toCells)=>{
    const rows=kids(tbl,'tr'); const tpls=[rows[1],rows[2]||rows[1]].map(r=>r.cloneNode(true));
    rows.slice(1).forEach(r=>r.remove());
    if(!items.length) items=[null];
    items.forEach((it,i)=>{ const tr=stripIds(tpls[i%2].cloneNode(true)); const tcs=kids(tr,'tc'); const vals=it?toCells(it):tcs.map(()=>[]); tcs.forEach((tc,j)=>setCellLines(tc,vals[j]||[])); tbl.appendChild(tr); });
  };
  const wl=(pos.lavoratori||[]).filter(w=>w.nome||w.mansione||(w.attestati||[]).length);
  fillRows(E[152],wl,w=>[[w.nome],[w.mansione],(w.attestati||[])]);
  const ml=(pos.mezzi||[]).filter(m=>m.mezzo||m.targa);
  fillRows(E[158],ml,m=>[[m.mezzo],[m.targa]]);

  // --- 6. turni ---
  {
    const ref=E[165]; const tl=lines(pos.turni);
    tl.forEach((l,i)=>{ if(i) body.insertBefore(stripIds(E[161].cloneNode(true)),ref); const p=stripIds(E[160].cloneNode(true)); setText(p,l); body.insertBefore(p,ref); });
    for(let i=160;i<=164;i++) E[i].remove();
  }

  // --- 7. allegati: al posto di “NTW …” l'oggetto dei lavori ---
  setText(E[174],'Documentazione completa di progetto '+oggetto);

  // --- impaginazione robusta: salti pagina reali al posto dei paragrafi vuoti di riempimento ---
  [[18,25],[43,54],[59,59],[65,76],[97,99],[109,127],[132,148],[154,154],[166,168]].forEach(([a,b])=>{ for(let i=a;i<=b;i++) if(E[i]&&E[i].parentNode&&isBlank(E[i])) E[i].remove(); });
  // Word: pageBreakBefore. Anteprima/PDF (docx-preview): interruzione di pagina esplicita.
  const pbr=p=>{ const r=mk(doc,'r'), b=mk(doc,'br'); b.setAttributeNS(WNS,'w:type','page'); r.appendChild(b); const ppr=kids(p,'pPr')[0]; p.insertBefore(r,ppr?ppr.nextSibling:p.firstChild); };
  [26,55,77,100,128,149,155].forEach(i=>preview?pbr(E[i]):addPBB(E[i]));
  if(preview){ const bp=mk(doc,'p'); pbr(bp); body.insertBefore(bp,E[60]); } else addPBB(kids(kids(kids(E[60],'tr')[0],'tc')[0],'p')[0]);
  all(doc,'lastRenderedPageBreak').forEach(e=>e.remove());

  z.file('word/document.xml',xmlDecl(ser.serializeToString(doc)));

  /* ---------- intestazione ---------- */
  const hdoc=parser.parseFromString(await z.file('word/header1.xml').async('string'),'application/xml');
  all(hdoc,'p').forEach(p=>{ const t=p.textContent.trim(); if(/^Realizzazione/.test(t)) setText(p,oggetto); else if(/^REV\./.test(t)) setText(p,headRev); });
  if(preview){ all(hdoc,'tr').forEach(tr=>kids(tr,'sdt').forEach(s=>{ const c=kids(s,'sdtContent')[0]; if(c) kids(c).forEach(x=>tr.insertBefore(x,s)); s.remove(); })); }
  z.file('word/header1.xml',xmlDecl(ser.serializeToString(hdoc)));

  /* ---------- proprietà (campi collegati: oggetto + revisione) ---------- */
  let core=await z.file('docProps/core.xml').async('string');
  core=core.replace(/<dc:subject>[\s\S]*?<\/dc:subject>/,'<dc:subject>'+xmlEsc(oggetto)+'</dc:subject>')
           .replace(/<cp:contentStatus>[\s\S]*?<\/cp:contentStatus>/,'<cp:contentStatus>'+xmlEsc(headRev)+'</cp:contentStatus>');
  z.file('docProps/core.xml',core);

  return z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',compression:'DEFLATE'});
}

const fileBase=pos=>'All_12_POS_'+slug(pos.oggetto)+(pos.revisione?'_'+slug(revString(pos.revisione)):'');
function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2500); }
async function exportWord(pos){
  try{ download(await buildDocx(pos), fileBase(pos)+'.docx'); toast('Documento Word generato','good'); }
  catch(e){ console.error(e); toast('Errore Word: '+e.message,'bad'); }
}
async function exportPdf(pos){
  try{
    const blob=await buildDocx(pos,true); const host=$('#printHost'); host.innerHTML='';
    await docx.renderAsync(blob,host,null,{inWrapper:true,breakPages:true,useBase64URL:true});
    const t=document.title; document.title=fileBase(pos);
    toast('Nella finestra di stampa scegli “Salva come PDF”');
    setTimeout(()=>{ window.print(); document.title=t; },400);
  }catch(e){ console.error(e); toast('Errore PDF: '+e.message,'bad'); }
}
async function exportPdfGoogle(pos,btn){
  busy(btn,true,'Conversione…');
  try{
    const blob=await buildDocx(pos,false); const buf=new Uint8Array(await blob.arrayBuffer()); let s=''; for(let i=0;i<buf.length;i+=8192) s+=String.fromCharCode.apply(null,buf.subarray(i,i+8192));
    const j=await api('pdf',{docx:btoa(s),name:fileBase(pos)});
    const bin=atob(j.pdf), out=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
    download(new Blob([out],{type:'application/pdf'}), fileBase(pos)+'.pdf'); toast('PDF generato','good');
  }catch(e){ toast(e.message,'bad'); }
  busy(btn,false);
}
window.__buildDocx=buildDocx; window.__newPos=newPos;
